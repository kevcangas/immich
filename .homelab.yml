app_name: immich
compose_path: docker/docker-compose.yml
env_path: docker/.env

services:
  - name: immich-web
    container: immich_server
    port: 2283
    subdomain: immich
    homepage: true
    icon: si-immich
    description: "Self-hosted photo and video backup & management platform"

  - name: immich-ml
    container: immich_machine_learning
    port: 3003
    subdomain: immich-ml
    homepage: false
    icon: mdi-brain
    description: "Immich Machine Learning Inference Service"
